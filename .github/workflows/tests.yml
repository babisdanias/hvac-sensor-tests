name: Robot tests

on:
  push:
  pull_request:
  workflow_dispatch:   # lets you start a run by hand from the Actions tab

jobs:
  robot:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run smoke tests first
        run: robot --include smoke --outputdir results/smoke tests

      - name: Run full regression suite
        run: robot --outputdir results/full tests

      - name: Keep the reports
        if: always()   # upload even when tests fail, so you can see why
        uses: actions/upload-artifact@v4
        with:
          name: robot-results
          path: results
